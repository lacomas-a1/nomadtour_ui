<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hero Design 3 - Glass Card Overlay</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'Segoe UI', sans-serif;
        }

        .hero-3 {
            height: 100vh;
            background: url('https://images.unsplash.com/photo-1547471080-7cc2caa01a7e?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80') center center/cover no-repeat;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .hero-3::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(0,0,0,0.3) 0%, rgba(0,0,0,0.5) 100%);
        }

        .glass-card {
            position: relative;
            z-index: 2;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 32px;
            padding: 3rem;
            max-width: 650px;
            margin: 0 20px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            animation: slideUp 0.8s ease-out;
        }

        .glass-card .tag {
            font-size: 0.7rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #C9A03D;
            font-weight: 700;
            margin-bottom: 1rem;
        }

        .glass-card h1 {
            font-size: 2.8rem;
            font-weight: 800;
            line-height: 1.2;
            margin-bottom: 1rem;
            color: #1C2D49;
        }

        .glass-card p {
            color: #4a5568;
            margin-bottom: 1.5rem;
            line-height: 1.6;
        }

        .stats {
            display: flex;
            gap: 2rem;
            margin-bottom: 2rem;
            padding: 1rem 0;
            border-top: 1px solid #e2e8f0;
            border-bottom: 1px solid #e2e8f0;
        }

        .stat-item {
            text-align: center;
        }

        .stat-number {
            font-size: 1.8rem;
            font-weight: 800;
            color: #C9A03D;
        }

        .stat-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #718096;
        }

        .btn-group-card {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .btn-glass-primary {
            background: #C9A03D;
            color: white;
            padding: 12px 32px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 700;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-glass-primary:hover {
            background: #b58d2e;
            transform: translateX(4px);
        }

        .btn-glass-outline {
            border: 2px solid #C9A03D;
            color: #C9A03D;
            padding: 12px 32px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 700;
            transition: all 0.3s;
            background: transparent;
        }

        .btn-glass-outline:hover {
            background: #C9A03D;
            color: white;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 600px) {
            .glass-card {
                padding: 1.8rem;
            }
            .glass-card h1 {
                font-size: 2rem;
            }
            .stats {
                gap: 1rem;
            }
            .stat-number {
                font-size: 1.3rem;
            }
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <section class="hero-3">
        <div class="glass-card">
            <div class="tag">✦ BESPOKE SAFARIS</div>
            <h1>Your Private<br>Kenya Safari Awaits</h1>
            <p>Discover the magic of Africa with tailor-made luxury safaris. Private vehicles, expert guides, and stays at the most exclusive lodges.</p>
            <div class="stats">
                <div class="stat-item">
                    <div class="stat-number">12+</div>
                    <div class="stat-label">Years Experience</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number">50+</div>
                    <div class="stat-label">Private Camps</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number">100%</div>
                    <div class="stat-label">Tailor-Made</div>
                </div>
            </div>
            <div class="btn-group-card">
                <a href="#" class="btn-glass-primary">Start Your Journey <i class="fas fa-arrow-right"></i></a>
                <a href="#" class="btn-glass-outline">View Safaris</a>
            </div>
        </div>
    </section>
</body>
</html>
