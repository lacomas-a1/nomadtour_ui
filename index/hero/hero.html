<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hero Design 1 - Centered Full Width</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Playfair Display', 'Georgia', serif;
        }

        .hero-1 {
            height: 100vh;
            background: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.5)), 
                        url('https://images.unsplash.com/photo-1516426122078-c23e76319801?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80') center center/cover no-repeat;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: white;
            position: relative;
        }

        .hero-1-content {
            max-width: 800px;
            padding: 0 20px;
            animation: fadeInUp 1s ease-out;
        }

        .hero-1-content .subtitle {
            font-size: 1rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 1rem;
            font-weight: 300;
        }

        .hero-1-content h1 {
            font-size: 4rem;
            font-weight: 700;
            margin-bottom: 1.5rem;
            line-height: 1.2;
        }

        .hero-1-content p {
            font-size: 1.2rem;
            margin-bottom: 2rem;
            opacity: 0.9;
        }

        .btn-group {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn-primary {
            background: #C9A03D;
            color: #1a2a3a;
            padding: 14px 36px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 700;
            transition: all 0.3s;
            border: 2px solid #C9A03D;
        }

        .btn-primary:hover {
            background: transparent;
            color: #C9A03D;
            transform: translateY(-3px);
        }

        .btn-outline {
            border: 2px solid white;
            color: white;
            padding: 14px 36px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 700;
            transition: all 0.3s;
            background: transparent;
        }

        .btn-outline:hover {
            background: white;
            color: #1a2a3a;
            transform: translateY(-3px);
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 768px) {
            .hero-1-content h1 { font-size: 2.5rem; }
            .hero-1-content p { font-size: 1rem; }
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>
    <section class="hero-1">
        <div class="hero-1-content">
            <div class="subtitle">Kenya's Finest</div>
            <h1>Luxury Safari<br>Experiences</h1>
            <p>Private guided safaris across Masai Mara, Amboseli & beyond</p>
            <div class="btn-group">
                <a href="#" class="btn-primary">Plan Your Safari</a>
                <a href="#" class="btn-outline">Explore Itineraries</a>
            </div>
        </div>
    </section>
</body>
</html>
